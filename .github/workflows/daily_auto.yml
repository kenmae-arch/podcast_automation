name: Scheduled Live News Podcast Generator (Aug 4-8)

on:
  schedule:
    - cron: '0 15 * * *' # 15:00 UTC = 00:00 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  live_generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check date & run live podcast generation
        env:
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
          FISH_AUDIO_REFERENCE_ID: ${{ vars.FISH_AUDIO_REFERENCE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_PROVIDER: gemini
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
          PODCAST_TITLE: ${{ vars.PODCAST_TITLE }}
          PODCAST_DESCRIPTION: ${{ vars.PODCAST_DESCRIPTION }}
          PODCAST_AUTHOR: ${{ vars.PODCAST_AUTHOR }}
          PODCAST_EMAIL: ${{ vars.PODCAST_EMAIL }}
          PODCAST_CATEGORY: ${{ vars.PODCAST_CATEGORY }}
          NEWS_FEED_URLS: ${{ vars.NEWS_FEED_URLS }}
        run: |
          python -c '
          import os, sys
          from datetime import datetime, timezone, timedelta

          jst = timezone(timedelta(hours=9))
          today_str = datetime.now(jst).strftime("%Y-%m-%d")
          print(f"Executing Live Podcast Generator for JST Date: {today_str}")

          if today_str > "2026-08-08":
              print("After 2026-08-08 limit. Skipping generation.")
              sys.exit(0)

          # Run main.py using live Gemini LLM provider
          res = os.system("python main.py")
          if res != 0:
              sys.exit(res)

          is_final_day = today_str >= "2026-08-08"
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"TODAY_STR={today_str}\n")
              f.write(f"IS_FINAL_DAY={str(is_final_day).lower()}\n")
          '

      - name: Commit and Push Generated Episode & Self-Cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/ scripts/published/ || true

          if [ "$IS_FINAL_DAY" = "true" ]; then
            echo "Final day reached (2026-08-08). Removing live auto workflow file..."
            git rm -f .github/workflows/daily_auto.yml || true
            git commit -m "Auto: daily live episode $TODAY_STR and self-cleanup 8/8 workflow"
          else
            git commit -m "Auto: daily live episode $TODAY_STR"
          fi

          git push origin main
